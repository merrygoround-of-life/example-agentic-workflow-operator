# This rule is not used by the project example-agentic-workflow-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over workflow.plantrue.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: example-agentic-workflow-operator
    app.kubernetes.io/managed-by: kustomize
  name: agenticworkflow-admin-role
rules:
- apiGroups:
  - workflow.plantrue.com
  resources:
  - agenticworkflows
  verbs:
  - '*'
- apiGroups:
  - workflow.plantrue.com
  resources:
  - agenticworkflows/status
  verbs:
  - get
