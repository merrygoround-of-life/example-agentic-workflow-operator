# This rule is not used by the project agentic-workflow-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the workflow.plantrue.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentic-workflow-operator
    app.kubernetes.io/managed-by: kustomize
  name: agenticworkflow-editor-role
rules:
- apiGroups:
  - workflow.plantrue.com
  resources:
  - agenticworkflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workflow.plantrue.com
  resources:
  - agenticworkflows/status
  verbs:
  - get
