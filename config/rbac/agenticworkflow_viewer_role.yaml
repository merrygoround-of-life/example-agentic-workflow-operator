# This rule is not used by the project agentic-workflow-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to workflow.plantrue.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentic-workflow-operator
    app.kubernetes.io/managed-by: kustomize
  name: agenticworkflow-viewer-role
rules:
- apiGroups:
  - workflow.plantrue.com
  resources:
  - agenticworkflows
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - workflow.plantrue.com
  resources:
  - agenticworkflows/status
  verbs:
  - get
