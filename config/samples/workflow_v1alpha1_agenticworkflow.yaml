apiVersion: workflow.plantrue.com/v1alpha1
kind: AgenticWorkflow
metadata:
  labels:
    app.kubernetes.io/name: agentic-workflow-operator
    app.kubernetes.io/managed-by: kustomize
  name: agenticworkflow-sample
spec:
  replicas: 2
  image: merrygoround/agentic-workflow-engine:latest
  port: 8080
  apiKeys:
    openai:
      name: llm-api-keys
      key: openai-api-key
    anthropic:
      name: llm-api-keys
      key: anthropic-api-key
    google:
      name: llm-api-keys
      key: google-api-key
